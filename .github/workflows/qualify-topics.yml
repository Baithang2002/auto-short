name: Qualify Daily Topics

on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-shorts-publish
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Qualify unused topics
        timeout-minutes: 35
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          DEFAULT_NICHE: "hidden science behind nature, Earth, animals, oceans, weather, and space"
          AUTO_VIDEO_SOURCE_COVERAGE_ENFORCE: "true"
          AUTO_VIDEO_SOURCE_COVERAGE_SUPPORTING_SCORE_RATIO: "0.65"
          AUTO_VIDEO_TOPIC_QUALIFICATION_TARGET_BUFFER: "3"
          AUTO_VIDEO_TOPIC_QUALIFICATION_MAX_ATTEMPTS: "6"
          AUTO_VIDEO_TOPIC_QUALIFICATION_TIMEOUT_SEC: "300"
          AUTO_VIDEO_TOPIC_QUALIFICATION_QUARANTINE_DAYS: "14"
        run: python topic_qualify.py

      - name: Persist qualification state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/topic_bank_state.json state/qualified_scripts/ || true
          if git diff --staged --quiet; then
            echo "No qualification state changes to commit."
          else
            git commit -m "ci: persist topic qualification state [skip ci]"
            git checkout -- .
            git pull --rebase origin main
            git push
          fi

      - name: Upload qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic-qualification-${{ github.run_number }}
          path: |
            output/topic_qualification_report.json
            output/topic_bank_status_report.json
            output/source_coverage_report.json
            output/editorial_identity_report.json
            output/shot_plan.json
            output/query_generation_report.json
          retention-days: 7
          if-no-files-found: ignore
