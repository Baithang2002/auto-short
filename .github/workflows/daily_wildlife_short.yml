name: Daily Autonomous Wildlife Short

on:
  # PAUSED FOR USER REVIEW: Scheduled triggers paused until remaining videos are reviewed.
  # schedule:
  #   - cron: '30 6 * * *'   # Slot 1: 06:30 UTC
  #   - cron: '30 13 * * *'  # Slot 2: 13:30 UTC
  #   - cron: '30 20 * * *'  # Slot 3: 20:30 UTC
  workflow_dispatch:      # Manual trigger only

permissions:
  contents: write

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg, Libass, Fonts & Deno
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libass-dev fonts-liberation fonts-dejavu-core fontconfig curl
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp google-api-python-client google-auth-oauthlib faster-whisper

      - name: Execute Daily Short & Publish to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN || secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN || secrets.YOUTUBE_REFRESH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || secrets.FACEBOOK_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN }}
        run: |
          python scripts/daily_autonomous_production.py --upload --notify

      - name: Commit Updated Queue Index
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/wildlife_story_queue.json
          git diff-index --quiet HEAD || git commit -m "chore: advance wildlife story queue index [skip ci]"
          git push
